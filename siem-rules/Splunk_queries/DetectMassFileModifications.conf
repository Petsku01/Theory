[DetectMassFileModifications]
search = index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=11 (TargetFilename="*.encrypted" OR TargetFilename="*.locked" OR TargetFilename="*.crypt" OR TargetFilename="*.ransom") earliest=-15m | stats count by Computer, Image | where count > 50
schedule = */5 * * * *
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 3600
alert.track = 1
action.email = 1
action.email.to = soc@yourcompany.com
action.email.subject = Ransomware Alert: Mass File Modifications Detected on %host%
action.email.message = High volume of suspicious file modifications detected. Host: %host%, File count: %count%, File pattern: %file_name%
action.email.sendresults = 1
