title: Suspicious Scheduled Task Creation
id: a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d
status: test
description: |
    Detects creation of scheduled tasks that may indicate persistence.
    Focus on tasks created via command line or from suspicious locations.
    
    Note: Scheduled tasks are common - tune based on your environment.
    Collect baseline data before enabling alerts.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://docs.microsoft.com/en-us/windows/win32/taskschd/task-scheduler-start-page
author: Security Operations Team
date: 2026/01/22

logsource:
    product: windows
    service: security

detection:
    # Event 4698: Scheduled task created
    selection_task_created:
        EventID: 4698
    
    # Suspicious task locations in TaskContent
    suspicious_path:
        TaskContent|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
            - '\ProgramData\'
            - 'C:\Windows\Temp\'
            - '\\\\' # UNC path
    
    # Suspicious executables
    suspicious_command:
        TaskContent|contains:
            - 'powershell'
            - 'cmd.exe /c'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - 'certutil'
            - 'bitsadmin'
    
    # Encoded commands in tasks
    suspicious_encoding:
        TaskContent|contains:
            - '-enc'
            - '-encodedcommand'
            - 'FromBase64String'
    
    # Filter legitimate software - CUSTOMIZE FOR YOUR ENVIRONMENT
    filter_legitimate:
        TaskContent|contains:
            - 'Microsoft\Windows\UpdateOrchestrator'
            - 'Microsoft\Windows\WindowsUpdate'
            - 'Microsoft\Office'
            - 'GoogleUpdate'
            - 'Adobe Acrobat Update'

    condition: selection_task_created and (suspicious_path or suspicious_command or suspicious_encoding) and not filter_legitimate

falsepositives:
    - Software installation creating update tasks
    - Legitimate admin automation
    - Backup software
    - Add your specific legitimate software to filter_legitimate

level: medium

tags:
    - attack.t1053.005

fields:
    - TaskName
    - TaskContent
    - SubjectUserName
    - SubjectDomainName
---
title: Scheduled Task Creation via Command Line
id: b2c3d4e5-f6a7-4b5c-9d0e-1f2a3b4c5d6e
status: test
description: |
    Detects schtasks.exe creating scheduled tasks from command line.
    This is a common persistence technique.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Security Operations Team
date: 2026/01/22

logsource:
    product: windows
    category: process_creation

detection:
    selection_schtasks:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    
    # Suspicious patterns
    suspicious_execution:
        CommandLine|contains:
            - '/sc onstart'
            - '/sc onlogon'
            - '/sc onidle'
            - '/ru system'
            - '/ru "system"'
    
    suspicious_command:
        CommandLine|contains:
            - 'powershell'
            - 'cmd /c'
            - 'cmd.exe /c'
            - 'wscript'
            - 'cscript'
            - 'mshta'
    
    # Remote task creation
    suspicious_remote:
        CommandLine|contains:
            - '/s '  # Remote system
            - '/S '

    condition: selection_schtasks and (suspicious_execution or suspicious_command or suspicious_remote)

falsepositives:
    - Legitimate administrative scripts
    - Software installers
    - Configuration management tools

level: medium

tags:
    - attack.t1053.005
