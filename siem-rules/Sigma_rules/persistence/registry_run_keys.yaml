title: Registry Run Key Modification
id: c3d4e5f6-a7b8-4c5d-0e1f-2a3b4c5d6e7f
status: test
description: |
    Detects modifications to registry run keys used for persistence.
    These keys automatically execute programs at user logon or system boot.
    
    Requires: Sysmon Event ID 13 (Registry Value Set)
references:
    - https://attack.mitre.org/techniques/T1547/001/
    - https://docs.microsoft.com/en-us/windows/win32/setupapi/run-and-runonce-registry-keys
author: Security Operations Team
date: 2026/01/22

logsource:
    product: windows
    category: registry_set

detection:
    selection_run_keys:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
            - '\Software\Microsoft\Windows\CurrentVersion\RunServices'
            - '\Software\Microsoft\Windows\CurrentVersion\RunServicesOnce'
            - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
            - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run'
    
    # Suspicious values being set
    suspicious_value:
        Details|contains:
            - 'powershell'
            - 'cmd.exe'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
            - 'http://'
            - 'https://'
    
    # Process making the change
    suspicious_process:
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\reg.exe'
    
    # Filter known legitimate software - CUSTOMIZE
    filter_legitimate:
        Details|contains:
            - 'Microsoft\OneDrive'
            - 'Google\Update'
            - 'Spotify'
            - 'Discord'
            - 'Microsoft Teams'

    condition: selection_run_keys and (suspicious_value or suspicious_process) and not filter_legitimate

falsepositives:
    - Software installation
    - Legitimate applications adding autostart entries
    - User configuration changes
    - Add your legitimate software to filter_legitimate

level: medium

tags:
    - attack.t1547.001

fields:
    - Image
    - TargetObject
    - Details
    - User
---
title: Registry Run Key Modification via reg.exe
id: d4e5f6a7-b8c9-4d5e-1f2a-3b4c5d6e7f8a
status: test
description: |
    Detects reg.exe being used to modify run keys.
    Direct registry modification is suspicious for persistence.
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Security Operations Team
date: 2026/01/22

logsource:
    product: windows
    category: process_creation

detection:
    selection_reg:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
            - 'add'
            - 'ADD'
    
    selection_run_keys:
        CommandLine|contains:
            - 'CurrentVersion\Run'
            - 'CurrentVersion\\Run'

    condition: selection_reg and selection_run_keys

falsepositives:
    - Administrative scripts
    - Software installers
    - GPO application

level: medium

tags:
    - attack.t1547.001
