title: Remote Service Installation via SCM
id: ff0a6b3c-1d2e-4f7a-6b9c-0d3e4f5a7b8c
status: stable
description: |
    Detects remote service installation via Service Control Manager,
    which is a common lateral movement technique. Attackers create
    services on remote systems to execute payloads.
references:
    - https://attack.mitre.org/techniques/T1021/002/
    - https://attack.mitre.org/techniques/T1569/002/
author: Security Operations Team
date: 2025/07/15
modified: 2026/01/22

logsource:
    product: windows
    service: system

detection:
    selection_service_install:
        EventID: 7045                      # A new service was installed
    
    selection_suspicious_paths:
        ImagePath|contains:
            - '\Temp\'
            - '\tmp\'
            - '\AppData\Local\'
            - '\ProgramData\'
            - '%TEMP%'
            - '%TMP%'
    
    selection_cmd_service:
        ImagePath|contains:
            - 'cmd.exe'
            - 'powershell'
            - 'mshta'
            - 'wscript'
            - 'cscript'
            - 'rundll32'
            - 'regsvr32'

    condition: selection_service_install and (selection_suspicious_paths or selection_cmd_service)

falsepositives:
    - Legitimate software installation
    - Enterprise software deployment
    - Administrative tools

level: high

tags:
    - attack.t1021.002
    - attack.t1543.003

fields:
    - ServiceName
    - ImagePath
    - ServiceType
    - StartType
