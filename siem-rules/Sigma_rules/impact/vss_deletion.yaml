title: Volume Shadow Copy Deletion - Ransomware Indicator
id: 2c3d9e6f-4a5b-4c0d-9e2f-3a6b7c8d0e1f
status: stable
description: |
    Detects deletion of Volume Shadow Copies, which is a strong indicator
    of ransomware activity. Attackers delete shadow copies to prevent
    file recovery after encryption. This is a critical detection.
references:
    - https://attack.mitre.org/techniques/T1490/
    - https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/vssadmin
author: Security Operations Team
date: 2025/04/20
modified: 2026/01/22

logsource:
    product: windows
    category: process_creation

detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains:
            - 'delete shadows'
            - 'Delete Shadows'
            - 'DELETE SHADOWS'
    
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'shadowcopy delete'
            - 'Shadowcopy Delete'
            - 'SHADOWCOPY DELETE'
    
    selection_powershell:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Get-WmiObject Win32_ShadowCopy'
            - 'Delete()'
    
    selection_wbadmin:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains:
            - 'delete catalog'
            - 'delete systemstatebackup'
    
    selection_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'recoveryenabled no'
            - 'bootstatuspolicy ignoreallfailures'

    condition: selection_vssadmin or selection_wmic or selection_powershell or selection_wbadmin or selection_bcdedit

falsepositives:
    - Legitimate backup software cleanup
    - System administrators managing disk space
    - Authorized maintenance scripts

level: critical

tags:
    - attack.t1490
    - attack.t1486

fields:
    - Image
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - User
    - Computer
